# Periscope console. By default it runs the released image (recommended); pin PERISCOPE_VERSION
# in .env (e.g. 0.3.0). To build from a checkout instead, add docker-compose.build.yml:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  periscope:
    image: "ghcr.io/lixeas/periscope-for-bunkerweb:${PERISCOPE_VERSION:-latest}"
    restart: unless-stopped
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "${PERISCOPE_TRUSTED_PROXY:-127.0.0.1}"
    volumes:
      - periscope-data:/data
    # Port published on the PERISCOPE_BIND address (127.0.0.1 by default = local access only).
    # For a reverse proxy (BunkerWeb) to reach it, whether on the same machine or on another
    # server, put this machine's PRIVATE IP in PERISCOPE_BIND (see docs/deploy-behind-proxy.md) and
    # allow only the proxy IP in the firewall. Never publish on a public interface.
    ports:
      - "${PERISCOPE_BIND:-127.0.0.1}:${PERISCOPE_PORT:-8000}:8000"
      # Agent listener (mutual TLS, only active when PERISCOPE_AGENT_PUBLIC_URL is set): the agents
      # in remote networks connect here. Publish it where they can reach it (PERISCOPE_AGENT_BIND),
      # directly or through a TCP/TLS passthrough, never behind a TLS-terminating proxy (docs/agent.md).
      - "${PERISCOPE_AGENT_BIND:-127.0.0.1}:${PERISCOPE_AGENT_PORT:-8443}:8443"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  periscope-data: {}
