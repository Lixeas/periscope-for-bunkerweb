services:
  periscope:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "${PERISCOPE_TRUSTED_PROXY:-127.0.0.1}"
    volumes:
      - periscope-data:/data
    # Port published on the PERISCOPE_BIND address (127.0.0.1 by default = local access only).
    # For a reverse proxy (BunkerWeb) to reach it, whether on the same machine or on another
    # server, put this machine's PRIVATE IP in PERISCOPE_BIND (see README) and
    # allow only the proxy IP in the firewall. Never publish on a public interface.
    ports:
      - "${PERISCOPE_BIND:-127.0.0.1}:${PERISCOPE_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  periscope-data: {}
