# =============================================================================
# Two REAL, independent BunkerWeb instances (bw1, bw2) to validate
# Periscope end to end (spec section 7).
#
# !!! NOT RUN / NOT VERIFIED !!!
# Docker is not installed on the machine where this file was written: it has
# never been started, not even validated with `docker compose config`. It was
# put together from the official documentation (docs.bunkerweb.io, "Integrations"
# and "API" pages, version 1.6.17). Unconfirmed points are marked
# "NOT CONFIRMED"; run `docker compose -f ... config` then
# `up` and fix as needed.
#
# Start:        docker compose -f dev/docker-compose.bunkerweb.yml up -d
# Each stack =  bunkerweb (proxy) + bunkerweb-scheduler + bunkerweb-api
#               + MariaDB (database shared by scheduler/API, as in the official
#               example) + a trivial upstream (nginx) protected by BunkerWeb.
#
# Host ports (bound to 127.0.0.1: the docs say not to expose the API to the Internet)
#   bw1: API 8081 -> 8888 internal; TLS 8443 -> 8443 (bunkerweb container)
#   bw2: API 8082 -> 8888 internal; TLS 9443 -> 8443
#
# Register in Periscope (Instances page):
#   bw1: API URL http://127.0.0.1:8081   probe host 127.0.0.1   TLS port 8443
#   bw2: API URL http://127.0.0.1:8082   probe host 127.0.0.1   TLS port 9443
#   If Periscope itself runs in a container, replace 127.0.0.1 with
#   host.docker.internal (or attach it to the networks below).
#   Token: see "API token" below. Probed domains (SNI):
#   app.bw1.test / app.bw2.test (services declared below).
#
# AUTHENTICATION (see also docs/bunkerweb-api-user.md)
#   Recommended: Periscope's "API user" mode with a restricted
#   ACL user (API_ACL_BOOTSTRAP_FILE file, commented block under bw1-api).
#   Periscope obtains a token via `POST /auth` (HTTP Basic; manual test:
#   `curl -u periscope:... -X POST http://127.0.0.1:8081/auth`, field
#   `.token`) and renews it on its own (lifetime: API_BISCUIT_TTL_SECONDS, 3600 s by
#   default according to the docs). Read permissions: instances_read, service_read,
#   global_config_read, ban_read, job_read, plugin_read.
#   Discouraged alternative: API_TOKEN, FULL ADMIN access, as a static Bearer.
#   It stays defined below for dev (`dev-token-bw1` / `dev-token-bw2`);
#   never do this in prod.
#
# Response alignment: once the instances are registered, compare the real
# API responses with src/periscope/normalize.py (Plan 3, Task 8).
# =============================================================================

x-db-uri-1: &db-uri-1 "mariadb+pymysql://bunkerweb:changeme@bw1-db:3306/db"
x-db-uri-2: &db-uri-2 "mariadb+pymysql://bunkerweb:changeme@bw2-db:3306/db"

x-mariadb: &mariadb
  image: mariadb:11
  command: --max-allowed-packet=67108864
  restart: "unless-stopped"

services:
  # ---------------------------------------------------------------- bw1 stack
  bw1:
    image: bunkerity/bunkerweb:1.6.17
    ports:
      - "127.0.0.1:8443:8443/tcp"   # TLS (8443 internal according to the docs)
    environment:
      # Must be identical in bunkerweb and the scheduler (docs). Static subnet
      # chosen by us (10.20.31.0/24): NOT CONFIRMED.
      API_WHITELIST_IP: "127.0.0.0/8 10.20.31.0/24"
      API_TOKEN: "dev-token-bw1"
    restart: "unless-stopped"
    networks: [bw1-universe, bw1-services]

  bw1-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.17
    depends_on: [bw1, bw1-db]
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.31.0/24"
      API_TOKEN: "dev-token-bw1"
      DATABASE_URI: *db-uri-1
      BUNKERWEB_INSTANCES: "bw1"
      MULTISITE: "yes"
      SERVER_NAME: "app.bw1.test"
      # Minimal protected service. The <server>_<SETTING> syntax is confirmed
      # in the all-in-one section of the docs; REVERSE_PROXY_URL "/" in
      # the example on the API page. The default (self-signed) certificate is
      # expected for the TLS probe: NOT CONFIRMED.
      app.bw1.test_USE_REVERSE_PROXY: "yes"
      app.bw1.test_REVERSE_PROXY_URL: "/"
      app.bw1.test_REVERSE_PROXY_HOST: "http://bw1-app:80"
    volumes: [bw1-storage:/data]
    restart: "unless-stopped"
    networks: [bw1-universe, bw1-db]

  bw1-api:
    image: bunkerity/bunkerweb-api:1.6.17
    depends_on: [bw1-db]
    ports:
      - "127.0.0.1:8081:8888"       # API (8888 internal according to the docs)
    environment:
      # NOT CONFIRMED: source IP seen through the published port (bridge
      # gateway, normally within the subnet below).
      API_WHITELIST_IPS: "127.0.0.0/8 10.20.31.0/24"
      API_TOKEN: "dev-token-bw1"
      DATABASE_URI: *db-uri-1
      API_USERNAME: "admin"
      API_PASSWORD: "Dev-Only-Passw0rd!"
      # Restricted user (recommended, docs): mount a JSON file via `volumes`
      # (./bw-acl-bootstrap.json:/var/lib/bunkerweb/api_acl_bootstrap.json:ro)
      # and uncomment the next line.
      # API_ACL_BOOTSTRAP_FILE: "/var/lib/bunkerweb/api_acl_bootstrap.json"
      # Content (general schema confirmed by the docs: users -> admin, password /
      # password_hash, permissions -> type -> id|"*" -> permission: true):
      # {"users":{"periscope":{"admin":false,"password_hash":"<bcrypt>",
      #   "permissions":{"instances":{"*":{"instances_read":true}},
      #   "global_config":{"*":{"global_config_read":true}},
      #   "services":{"*":{"service_read":true}},"bans":{"*":{"ban_read":true}},
      #   "jobs":{"*":{"job_read":true}},"plugins":{"*":{"plugin_read":true}}}}}}
      # NOT CONFIRMED: resource types other than "services" (keys above
      # inferred); file never tested.
    restart: "unless-stopped"
    networks: [bw1-universe, bw1-db]

  bw1-db:
    <<: *mariadb
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "changeme"
    volumes: [bw1-data:/var/lib/mysql]
    networks: [bw1-db]

  bw1-app:   # trivial upstream (generic image, not part of the BunkerWeb docs)
    image: nginx:alpine
    networks: [bw1-services]

  # ---------------------------------------------------------------- bw2 stack
  bw2:
    image: bunkerity/bunkerweb:1.6.17
    ports:
      - "127.0.0.1:9443:8443/tcp"
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.32.0/24"
      API_TOKEN: "dev-token-bw2"
    restart: "unless-stopped"
    networks: [bw2-universe, bw2-services]

  bw2-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.17
    depends_on: [bw2, bw2-db]
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.32.0/24"
      API_TOKEN: "dev-token-bw2"
      DATABASE_URI: *db-uri-2
      BUNKERWEB_INSTANCES: "bw2"
      MULTISITE: "yes"
      SERVER_NAME: "app.bw2.test"
      app.bw2.test_USE_REVERSE_PROXY: "yes"
      app.bw2.test_REVERSE_PROXY_URL: "/"
      app.bw2.test_REVERSE_PROXY_HOST: "http://bw2-app:80"
    volumes: [bw2-storage:/data]
    restart: "unless-stopped"
    networks: [bw2-universe, bw2-db]

  bw2-api:
    image: bunkerity/bunkerweb-api:1.6.17
    depends_on: [bw2-db]
    ports:
      - "127.0.0.1:8082:8888"
    environment:
      API_WHITELIST_IPS: "127.0.0.0/8 10.20.32.0/24"
      API_TOKEN: "dev-token-bw2"
      DATABASE_URI: *db-uri-2
      API_USERNAME: "admin"
      API_PASSWORD: "Dev-Only-Passw0rd!"
    restart: "unless-stopped"
    networks: [bw2-universe, bw2-db]

  bw2-db:
    <<: *mariadb
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "db"
      MYSQL_USER: "bunkerweb"
      MYSQL_PASSWORD: "changeme"
    volumes: [bw2-data:/var/lib/mysql]
    networks: [bw2-db]

  bw2-app:
    image: nginx:alpine
    networks: [bw2-services]

volumes:
  bw1-data:
  bw1-storage:
  bw2-data:
  bw2-storage:

networks:
  bw1-universe:
    ipam:
      config: [{subnet: 10.20.31.0/24}]
  bw1-services:
  bw1-db:
  bw2-universe:
    ipam:
      config: [{subnet: 10.20.32.0/24}]
  bw2-services:
  bw2-db:
