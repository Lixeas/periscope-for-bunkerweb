{{- if or .Values.secretKey.value .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "periscope.fullname" . }}
  labels:
    {{- include "periscope.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- with .Values.secretKey.value }}
  secret-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.database.url }}
  database-url: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
