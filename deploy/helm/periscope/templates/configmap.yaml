apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "periscope.fullname" . }}
  labels:
    {{- include "periscope.labels" . | nindent 4 }}
data:
  {{- $origins := include "periscope.origins" . }}
  {{- if ne $origins "[]" }}
  PERISCOPE_ORIGINS: {{ $origins | quote }}
  {{- end }}
  {{- with (include "periscope.rpId" .) }}
  PERISCOPE_RP_ID: {{ . | quote }}
  {{- end }}
  PERISCOPE_COOKIE_SECURE: {{ .Values.config.cookieSecure | toString | quote }}
  PERISCOPE_POLL_INTERVAL: {{ .Values.config.pollInterval | toString | quote }}
  PERISCOPE_PROBE_INTERVAL: {{ .Values.config.probeInterval | toString | quote }}
  FORWARDED_ALLOW_IPS: {{ .Values.config.trustedProxies | quote }}
  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
