{{- if or .Values.enrollment.bundle .Values.bunkerweb.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "periscope-agent.fullname" . }}
  labels:
    {{- include "periscope-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- with .Values.enrollment.bundle }}
  bundle: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.bunkerweb.password }}
  password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
