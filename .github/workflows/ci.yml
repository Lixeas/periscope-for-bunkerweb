name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests dev
      - run: python -m pytest -q

  # Migrations and ORM against a real PostgreSQL (tests/test_postgres.py is skipped without the variable).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: periscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PERISCOPE_TEST_POSTGRES_URL: postgresql://postgres:periscope@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: python -m pytest -q tests/test_postgres.py -rs

  # Helm charts (deploy/helm): rendered with several values sets, schema-checked with kubeconform,
  # lint --strict, packaged. The pinned tools come from dev/k8s-tools.sh (checksum-verified downloads).
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: dev/k8s-tools.sh
      - run: echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: python -m pytest -q tests/test_helm_console.py tests/test_helm_agent.py tests/test_helm_charts.py tests/test_release.py

  # Real cluster: the charts are installed on kind, upgraded, and probed (dev/k8s-smoke.sh).
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: dev/k8s-tools.sh
      - run: echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: docker build -t periscope:ci .
      - run: dev/k8s-smoke.sh periscope:ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t periscope:ci .
      - name: PostgreSQL driver is in the image
        run: docker run --rm periscope:ci python -c "import psycopg"
      - name: Start the container and wait for it to answer
        run: |
          docker run -d --name periscope \
            -e PERISCOPE_SECRET_KEY="$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e PERISCOPE_COOKIE_SECURE=false \
            -p 8000:8000 periscope:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/login && exit 0
            sleep 2
          done
          docker logs periscope
          exit 1

  # Pull requests: the version may stay the same (no release) or go up by exactly one step, with its
  # notes in CHANGELOG.md. Nothing is tagged or published here.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare with the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git show "origin/${BASE_REF}:src/periscope/__init__.py" | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          python dev/release.py check --base "$base"
          version=$(python dev/release.py current)
          if [ "$version" != "$base" ] && git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::tag v${version} already exists: bump the version"
            exit 1
          fi

  # After the merge (push to main), once the tests and the image build pass: if the version in
  # src/periscope/__init__.py has no tag yet, create the tag vX.Y.Z, the GitHub release (notes from
  # CHANGELOG.md) and the container image ghcr.io/<owner>/<repo>:X.Y.Z.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, postgres, charts, kind, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version to release
        id: v
        run: |
          version=$(python dev/release.py current)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v${version} already released: nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Charts package cleanly (before anything is tagged)
        if: steps.v.outputs.new == 'true'
        run: |
          dev/k8s-tools.sh
          export PATH="$PWD/.tools/bin:$PATH"
          for chart in periscope periscope-agent; do helm package "deploy/helm/${chart}" -d "${RUNNER_TEMP}/charts-check"; done
      - name: Tag and GitHub release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python dev/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Container image
        if: steps.v.outputs.new == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${REPO,,}"
          minor="${VERSION%.*}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${REPO}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${image}:${VERSION}" -t "${image}:${minor}" -t "${image}:latest" .
          docker push --all-tags "${image}"
      # Not tied to "new": a re-run after a failed push publishes the missing charts. Only for the commit the
      # version tag points at, and never a version that is already in the registry.
      - name: Helm charts (OCI)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          if ! git ls-remote --tags origin "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}" | cut -f1 | grep -qx "$GITHUB_SHA"; then
            echo "v${VERSION} was not released from this commit: charts not published"
            exit 0
          fi
          dev/k8s-tools.sh
          export PATH="$PWD/.tools/bin:$PATH"
          owner="${REPO%%/*}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          for chart in periscope periscope-agent; do
            ref="oci://ghcr.io/${owner,,}/charts/${chart}"
            if helm pull "$ref" --version "$VERSION" -d "${RUNNER_TEMP}/pulled" >/dev/null 2>&1; then
              echo "${chart} ${VERSION} is already published"
              continue
            fi
            helm package "deploy/helm/${chart}" -d "${RUNNER_TEMP}/charts"
            helm push "${RUNNER_TEMP}/charts/${chart}-${VERSION}.tgz" "oci://ghcr.io/${owner,,}/charts"
          done
